# Analyse statique JavaScript (CodeQL). Public : gratuit. Le ruleset n'exige
# pas ce job — il tourne en plus de la CI, pour les alertes de sécurité.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyser:
    name: Analyser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
